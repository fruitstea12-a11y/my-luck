<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 운 사용설명서 — 사주 × MBTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script src="products.js"></script>
<style>
:root{--paper:#F4ECDF;--panel:#FBF6EC;--ink:#2B2622;--sub:#6E655C;--line:#DCCFBC;--chip:#EBE0CE;
--mok:#5E7F55;--hwa:#C8643B;--to:#B8893E;--geum:#7F7B76;--su:#3E5A7E;--accent:#9B3D2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1E1B18;--panel:#29251F;--ink:#EFE6D8;--sub:#B3A898;--line:#3E372E;--chip:#352F27;--mok:#8FB283;--hwa:#E48A62;--to:#D5A65B;--geum:#B2ADA6;--su:#7F9CC6;--accent:#E07D63}}
:root[data-theme="dark"]{--paper:#1E1B18;--panel:#29251F;--ink:#EFE6D8;--sub:#B3A898;--line:#3E372E;--chip:#352F27;--mok:#8FB283;--hwa:#E48A62;--to:#D5A65B;--geum:#B2ADA6;--su:#7F9CC6;--accent:#E07D63}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 64px}
h1,h2,h3,.big,.brand{font-family:"Gowun Batang",serif}
h1{font-size:clamp(30px,8vw,40px);line-height:1.25;margin:6px 0 10px}
h2{font-size:24px;line-height:1.35;margin:4px 0 10px} h2 small{font-size:15px;color:var(--sub);font-family:"IBM Plex Sans KR"}
h3{font-size:21px;margin:0 0 10px} h4{font-size:14px;margin:14px 0 4px;color:var(--accent)} h4 small{color:var(--sub);font-weight:400}
p{margin:0 0 6px} small{color:var(--sub)}
.brand{color:var(--accent);font-size:14px;letter-spacing:.08em;margin:0}
.intro .brand{font-size:15px;letter-spacing:.16em;color:var(--sub);margin:0 0 6px}
.tagline{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(23px,6.2vw,28px);letter-spacing:.08em;color:var(--ink);margin:0 0 16px}
.intro h1{margin-top:2px}
.intro .lede{margin-bottom:10px}
.intro .back{margin:0 0 10px;font-size:14px;color:var(--sub)}
.lede{color:var(--sub)} .fine{font-size:12px;color:var(--sub)}
.bandhelp{margin-top:8px;font-size:12px;color:var(--sub)}
.bandhelp>summary{cursor:pointer;list-style:none;display:inline-block;padding:4px 10px;border:1px solid var(--line,#ddd);border-radius:999px;font-size:11.5px}
.bandhelp>summary::-webkit-details-marker{display:none}
.bandhelp[open]>summary{margin-bottom:6px}
.bandhelp .fine{margin:4px 0}
/* 오늘의 운 타이포 4단계 — 섹션 제목 / 핵심 1줄 / 본문 / 라벨·보조 */
.todaytop .hint{display:block;margin-top:6px;font-size:12px;font-weight:400;color:var(--sub);line-height:1.6}
.todaytop .lead{margin:0;font-size:15px;font-weight:700;line-height:1.6}
.sec{margin:22px 0 8px;font-size:12px;letter-spacing:.02em;color:var(--sub);font-weight:700}
.weekbox{margin:20px 0 8px;border:1px solid var(--line,#e5e0d8);border-radius:12px;padding:10px 12px}
.weekbox>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.02em;color:var(--sub);font-weight:700}
.weekbox>summary::-webkit-details-marker{display:none}
.weekbox>summary::after{content:' ▾'}
.weekbox[open]>summary::after{content:' ▴'}
.tri{border:1px solid var(--line,#e5e0d8);border-radius:12px;padding:12px 14px;margin-top:6px}
.tri>p{margin:0 0 10px;font-size:14px;font-weight:400;line-height:1.65}
.tri>p:last-child{margin-bottom:0}
.tri .lab{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:3px;letter-spacing:.02em}
.tri .key{display:block;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:3px}
.tri .q{font-weight:600;font-size:14px}
.tri.warn{border-color:#d9a441;background:rgba(217,164,65,.06)}
.tri>p+p{padding-top:8px;border-top:1px solid var(--line,#efe9e0)}
.intro .fine{font-size:13px;line-height:1.6;color:var(--sub);max-width:30em;margin:6px auto 0} .err{color:var(--accent);min-height:1.4em;font-size:14px}
.stepno{font-size:12px;color:var(--sub);letter-spacing:.06em;margin:0}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--to);outline-offset:2px}
.primary{display:block;width:100%;background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;font-size:17px;padding:16px;margin:14px 0 8px}
.ghost{display:block;width:100%;background:none;border:0;color:var(--sub);padding:10px}
.mini{padding:4px 10px;font-size:13px}
.intro{text-align:center;padding-top:18px}
.pair{display:flex;justify-content:center;gap:2px;margin:6px 0 14px}.pair img{height:250px;width:auto}
/* 휴대폰에서는 첫 화면 안에 버튼이 들어와야 한다.
   iOS Safari 는 주소창이 접힌 상태 기준 높이를 알려줘서 max-height 만으로는 안 걸린다. 폭 조건을 함께 둔다. */
@media (max-height:860px), (max-width:520px){
  .intro{padding-top:8px}
  .intro .brand{font-size:13px;margin-bottom:2px}
  .tagline{font-size:clamp(20px,5.4vw,24px);margin-bottom:8px}
  .intro h1{font-size:clamp(26px,7vw,32px);margin:2px 0 6px}
  .intro .lede{font-size:14px;line-height:1.55;margin-bottom:4px}
  .pair{margin:2px 0 8px}
  .pair img{height:215px}
  .steps{gap:7px;font-size:14px;margin-bottom:6px}
  .steps b{width:20px;height:20px}
  .primary{padding:14px;margin:10px 0 6px}
  .intro .fine{font-size:11.5px;margin-top:4px}
}
/* 휴대폰: 버튼을 먼저 보여주고 3단계 안내는 그 아래로 내린다 */
@media (max-width:520px){
  .intro{display:flex;flex-direction:column;align-items:center;padding-top:6px;
         padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .intro>*{width:100%}
  .intro .steps{width:auto;order:8;margin:34px 0 6px}
  .intro .fine{order:9}
  .intro .primary{order:7;font-size:16px;padding:14px;border-radius:18px;margin:20px 0 0}
  .intro .ghost{order:7;padding:10px;margin:6px 0 0}
  .intro .back{order:6}
  .pair{margin:4px 0 0}
  .pair img{height:230px}
  .intro h1{font-size:clamp(25px,6.8vw,31px)}
  .intro .lede{font-size:13.5px}
  .steps{gap:7px;font-size:13.5px}
}
@media (max-width:520px) and (max-height:700px){
  .pair img{height:225px}
  .intro .brand{font-size:12px}
  .tagline{font-size:20px;margin-bottom:6px}
  .intro .steps{margin-top:26px}
}

@media (max-height:720px){
  .intro h1{font-size:clamp(23px,6.2vw,27px)}
  .intro .lede{font-size:13px;line-height:1.5;margin-bottom:2px}
  .steps{gap:5px;font-size:13px}
}
.steps{list-style:none;padding:0;margin:0 auto 10px;display:inline-flex;flex-direction:column;gap:12px;text-align:left;font-size:15px}
.steps b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);font-size:12px;margin-right:8px}
.form{display:flex;flex-direction:column;gap:12px;margin:14px 0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
.row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.timebox{display:flex;flex-direction:column;gap:4px}.tlabel{font-size:13px;color:var(--sub)}
.row2s{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2s label{font-size:12px}.hide{display:none!important}
.warnline{font-size:11.5px;line-height:1.5;color:var(--accent);background:var(--chip);border-radius:8px;padding:6px 10px;margin:6px 0 0}
.row3d{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;align-items:center}
select:disabled{opacity:.45}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chk input{width:auto}
.seg{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.adv summary{cursor:pointer;font-size:13px;color:var(--sub);padding:4px 0} .adv{display:flex;flex-direction:column;gap:6px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.choice button{display:flex;flex-direction:column;gap:4px;padding:20px 12px;text-align:center}.choice b{font-size:16px}.choice span{font-size:12px;color:var(--sub)}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.grid16 button{padding:14px 4px;font-weight:600}
.prog{height:4px;background:var(--chip);border-radius:2px;margin:8px 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.scale{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.scale>button{text-align:left;padding:16px}.scale>button b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--chip);margin-right:10px;font-size:12px}
.scale .mid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scale .mid button{font-size:13px;color:var(--sub);padding:10px}
.axes{display:flex;flex-direction:column;gap:10px;margin:14px 0}.ax{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:14px}.ax .bar{width:100%}
.ax em{grid-column:2;font-style:normal;font-size:12px;color:var(--accent)} .axes.sm .ax{grid-template-columns:52px 1fr;font-size:12px}.axes.sm{gap:4px;margin:6px 0}
.bar{position:relative;height:10px;background:var(--chip);border-radius:5px;overflow:hidden;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--ink);border-radius:5px}
.dom small em{font-style:normal;font-weight:600;margin-left:4px;opacity:.75}
.hero{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:8px}
.hero .char{width:86px;height:auto;margin-top:0}.hero h2{margin:1px 0 4px;font-size:clamp(18px,5vw,22px);line-height:1.25}.hero h2 .nm{display:block}
.hero .brand{letter-spacing:.02em;font-size:12px}
@media (max-width:380px){.hero{grid-template-columns:72px minmax(0,1fr);gap:10px}.hero .char{width:72px}}
.ilgan{margin:0 0 4px;font-size:13.5px}.ilgan b{font-family:"Gowun Batang",serif;font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badges span{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 10px}.badges .mb{background:var(--ink);color:var(--paper)}
.tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;background:var(--paper)}
#card{scroll-margin-top:104px}
.tabs button{font-size:12.5px;line-height:1.3;padding:7px 6px;border-radius:14px;background:var(--panel);color:var(--sub);border:1px solid var(--line);white-space:normal;word-break:keep-all;min-height:42px}
@media (min-width:520px){.tabs button{font-size:13.5px;border-radius:999px}}
.tabs button[aria-selected="true"]{background:var(--line);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 15px}
.card .no{font-size:12px;color:var(--to);letter-spacing:.08em;margin:0}
.big{font-size:21px;line-height:1.4;margin:0 0 10px!important}.big span{font-size:15px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--paper);border-radius:12px;padding:9px 10px}.col h4{margin-top:0;margin-bottom:3px;font-size:13px}.col p{font-size:13px;line-height:1.6}
.col .tags{margin-bottom:5px}.col .tags span{font-size:11.5px;padding:1px 7px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}.tags span{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 9px}
.tags.fields span{font-size:14px;padding:4px 12px;background:var(--paper);border:1px solid var(--line)}
.combo{margin:12px 0 4px;padding:10px 14px;border-left:3px solid var(--to);background:var(--paper);border-radius:0 10px 10px 0}
.combo p{margin:0;font-size:14px;font-weight:400;line-height:1.65}
.combo .key{display:block;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:3px}
.combo small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:3px}
.els{display:flex;flex-direction:column;gap:5px}.el{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}.el .bar{width:100%}
.el span em{font-style:normal;font-size:11px;opacity:.65;margin-left:2px}.el span{font-weight:600}
.lc{width:100%;height:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:8px}.legend i{display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle}
.tl{list-style:none;padding:0;margin:8px 0 0}.tl li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tl .age{background:var(--ink);color:var(--paper);border-radius:10px;text-align:center;font-weight:600;padding:6px 2px;height:max-content;line-height:1.25}
.tl .age small{display:block;color:inherit;opacity:.75;font-size:11px;font-weight:400}
.tl .age em{display:block;margin-top:3px;font-style:normal;font-size:11px;font-weight:600;opacity:.95}.tl li.past .age{background:var(--chip);color:var(--ink)}
.lab{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--sub);margin:0 0 3px}
.tl li>div:last-child>b{display:block;font-size:16px;line-height:1.35;margin-bottom:6px}
.tl li p{margin:0 0 7px}
.rel{display:inline-block;font-size:12px;font-weight:600;color:var(--sub);background:var(--chip);border-radius:999px;padding:2px 10px;margin:1px 0 8px}.rel.clash{color:var(--accent)}.rel.match{color:var(--mok)}
.q{font-family:"Gowun Batang",serif;color:var(--ink);font-size:15px;line-height:1.5;margin:10px 0 8px!important;padding-left:10px;border-left:2px solid var(--line)}.basis{font-size:11px;color:var(--sub);opacity:.85}
.shop{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.shop small{color:var(--sub);font-size:12px}
.shop ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.shop a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.shop a em{font-style:normal;font-size:11px;color:var(--sub)}
.shop .fine{margin-top:8px;font-size:10.5px;line-height:1.5}
.item{margin-top:12px;background:var(--chip);border-radius:12px;padding:12px 14px}
.item small{color:var(--sub);font-size:12px}
.item .ib{margin:0 0 4px;font-family:"Gowun Batang",serif;font-size:18px}
.item p{margin:0}
.item .fine{margin-top:6px}
.relflow{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.watch{list-style:none;margin:8px 0 0;padding:0}
.watch li{padding:10px 0;border-bottom:1px solid var(--line,#efe9e0)}
.watch li:last-child{border-bottom:0}
.watch .key{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
.watch p{margin:0 0 4px;font-size:14px;line-height:1.65}
.watch small{font-size:12px;color:var(--sub)}
.basis .gt{font-weight:500;border-bottom:1px dotted var(--line);cursor:help}
.yb{display:flex;align-items:flex-end;height:110px;border-bottom:1px solid var(--line);margin:8px 0 4px}

.ybc small{font-size:9px;line-height:1.5}
.pill{background:var(--paper);border-radius:10px;padding:9px 12px;margin:0 0 7px;box-shadow:inset 3px 0 0 var(--to)}
.pill.bad{box-shadow:inset 3px 0 0 var(--accent)}
.pill.turn{box-shadow:inset 3px 0 0 var(--sub)}
.pill em{font-style:normal;font-size:12px;color:var(--sub)}.pill .sc{float:right;font-size:12px;color:var(--sub)}.pill p{margin:4px 0 0;font-size:14px}
.type{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px}.type .big{margin:2px 0 0!important}
.checks{padding:0;list-style:none;margin:0}.checks li{padding:6px 0 6px 24px;position:relative;border-bottom:1px dashed var(--line)}.checks li::before{content:'✔';position:absolute;left:2px;color:var(--mok)}
details summary{cursor:pointer;color:var(--sub);font-size:14px;padding:10px 0}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.mt{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);text-align:left;gap:0}
.mt span{font-size:12px;color:var(--sub)}.mt b{font-size:14px}.mt small{font-size:11px;line-height:1.3;min-height:1.3em}
.mt{position:relative;cursor:pointer;transition:transform .08s,box-shadow .08s;padding-right:20px}
.mt::after{content:'\203A';position:absolute;right:9px;top:7px;font-size:15px;line-height:1;color:var(--sub);opacity:.55}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:12px}.actions .primary{margin:0}
.pager{display:grid;grid-template-columns:1fr 1fr}

.vswitch button{border:0;border-radius:999px;background:none;color:var(--sub);font-weight:600;font-size:14px;padding:9px 6px}
.vswitch button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.todaytop{background:var(--paper);border-radius:12px;padding:12px 14px;box-shadow:inset 3px 0 0 var(--c)}.todaytop .big{margin:2px 0 0!important}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}.wk div{display:flex;flex-direction:column;align-items:center;background:var(--paper);border-radius:10px;padding:6px 0;font-size:12px}
.wk u{text-decoration:none;font-size:11px;font-weight:700;color:var(--c)}
.wk div.on{outline:2px solid var(--ink)}.wk b{font-size:14px}.wk i{width:8px;height:8px;border-radius:50%;background:var(--c);margin:3px 0}.wk em{font-style:normal;font-size:10.5px;color:var(--sub)}
#shareStage{position:fixed;left:-10000px;top:0}
.share{width:360px;height:640px;background:#F4ECDF;color:#2B2622;padding:34px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:"IBM Plex Sans KR",sans-serif}
.share .sbrand{font-family:"Gowun Batang",serif;color:#9B3D2A;font-size:13px;letter-spacing:.1em;margin:0}
.share .sname{font-family:"Gowun Batang",serif;font-size:22px;margin:4px 0 8px}
.share img{height:250px;width:auto;margin:4px 0}
.share .silgan{font-size:15px;margin:6px 0}.share .silgan b{font-family:"Gowun Batang",serif;font-size:19px}
.share .sone{font-family:"Gowun Batang",serif;font-size:19px;line-height:1.45;margin:8px 0}
.share .stags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.share .stags span{background:#EBE0CE;border-radius:999px;padding:2px 10px;font-size:13px}
.share .sbest{font-size:13px;margin:14px 0 0;color:#6E655C}.share .sbest b{color:#2B2622}
.share .sfoot{margin-top:auto;font-size:12px;color:#6E655C}
</style>

function tenGod(day,s){const e=stemEl(day),o=stemEl(s),same=(day%2)===(s%2);
  let k; if(o===e)k=0; else if(o===(e+1)%5)k=2; else if(o===(e+2)%5)k=4; else if(e===(o+2)%5)k=6; else k=8;
  return TG[k+(same?0:1)];}

function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
const sunLon=date=>Astronomy.SunPosition(date).elon;
function jeolNext(date){const l=sunLon(date);const t=mod(15+30*Math.ceil((l-15+1e-9)/30),360);return Astronomy.SearchSunLongitude(t,date,40).date}
function jeolPrev(date){const l=sunLon(date);const t=mod(15+30*Math.floor((l-15)/30),360);return Astronomy.SearchSunLongitude(t,new Date(date.getTime()-40*864e5),40).date}
function sajuYear(date){const y=date.getUTCFullYear();const ip=Astronomy.SearchSunLongitude(315,new Date(Date.UTC(y,0,1)),80).date;return date<ip?y-1:y}
function yearPillar(sy){const i=mod(sy-4,60);return {s:i%10,b:i%12}}
function monthPillar(date){const sy=sajuYear(date),ys=yearPillar(sy).s;const m=Math.floor(mod(sunLon(date)-315,360)/30);
  return {s:mod(((ys%5)*2+2)+m,10),b:(m+2)%12}}

function koreaClockOffset(y,m,d,hh,mm){const k=String(y)+String(m).padStart(2,'0')+String(d).padStart(2,'0')+String(hh??12).padStart(2,'0')+String(mm??0).padStart(2,'0');
  const ymd=k.slice(0,8);const tz=(ymd>='19540321'&&ymd<='19610809')?8.5:(ymd<'19120101'?8.5:9);
  const dst=KR_DST.some(([a,b])=>k>=a&&k<b);return {tz,dst}}
function pairName(p){return STEM[p.s]+BRANCH[p.b]}

function buildChart(inp){
  // inp: {y,m,d,hh,mm|null,lon,tz,dst,gender:'m'|'f',ziMode:'jo'|'ya'}
  const off=inp.tz+(inp.dst?1:0);
  const hasTime=inp.hh!=null;
  const clockH=hasTime?inp.hh:12, clockM=hasTime?inp.mm:0;
  const utc=new Date(Date.UTC(inp.y,inp.m-1,inp.d,clockH,clockM)-off*36e5);
  const trueMin=(inp.lon-inp.tz*15)*4+eot(utc);
  const tst=new Date(utc.getTime()+(inp.tz*60+trueMin)*6e4); // true solar local (as UTC fields)
  let dY=tst.getUTCFullYear(),dM=tst.getUTCMonth()+1,dD=tst.getUTCDate(),th=tst.getUTCHours(),tm=tst.getUTCMinutes();
  let dayShift=0; if(hasTime&&inp.ziMode!=='ya'&&th===23)dayShift=1;
  const dayIdx=mod(jdn(dY,dM,dD)+dayShift-2415021+10,60);
  const year=yearPillar(sajuYear(utc)), month=monthPillar(utc), day={s:dayIdx%10,b:dayIdx%12};
  let hour=null; if(hasTime){const hb=Math.floor((th+1)/2)%12;const hs=(inp.ziMode==='ya'&&th===23)?(day.s+1)%10:day.s;hour={s:mod((hs%5)*2+hb,10),b:hb}} // 야자시: 일주는 당일, 자시 천간은 다음날 기준
  const pillars={year,month,day,hour};
  // daewoon
  const forward=((year.s%2===0)===(inp.gender==='m'));
  const jd=forward?jeolNext(utc):jeolPrev(utc);
  const days=Math.abs(jd-utc)/864e5; const startAge=days/3;
  const dws=[];for(let i=1;i<=9;i++){const k=forward?i:-i;const idx=mod(sexIdx(month)+k,60);
    const ageStart=startAge+(i-1)*10;dws.push({s:idx%10,b:idx%12,ageStart,yearStart:inp.y+ageStart})}
  // jeol-day flag (no time)
  const nearJeol=!hasTime&&(Math.abs(jeolNext(utc)-utc)<864e5||Math.abs(utc-jeolPrev(utc))<864e5);
  const natal=analyzeNatal(pillars);
  return {inp,utc,trueSolar:{min:Math.round(trueMin),h:th,m:tm},pillars,forward,daewoonStartAge:startAge,daewoon:dws,nearJeol,natal,hasTime}
}
function sexIdx(p){for(let i=0;i<60;i++)if(i%10===p.s&&i%12===p.b)return i}

function analyzeNatal(P){
  const day=P.day.s; const els=[0,0,0,0,0]; const gods={}; TG.forEach(t=>gods[t]=0);
  const add=(s,w)=>{els[stemEl(s)]+=w;gods[tenGod(day,s)]+=w};
  const stems=[[P.year.s,1],[P.month.s,1],[P.hour?P.hour.s:null,1]];
  stems.forEach(([s,w])=>{if(s!=null)add(s,w)}); els[stemEl(day)]+=1;
  const brs=[[P.year.b,1],[P.month.b,3],[P.day.b,1.5],[P.hour?P.hour.b:null,1]];
  brs.forEach(([b,w])=>{if(b==null)return;HIDDEN[b].forEach(([s,d])=>add(s,w*d/30))});
  const total=els.reduce((a,b)=>a+b,0);
  const helpEl=[stemEl(day),mod(stemEl(day)-1,5)];
  let help=0,all=0; stems.forEach(([s,w])=>{if(s==null)return;all+=w;if(helpEl.includes(stemEl(s)))help+=w});
  brs.forEach(([b,w])=>{if(b==null)return;HIDDEN[b].forEach(([s,d])=>{all+=w*d/30;if(helpEl.includes(stemEl(s)))help+=w*d/30})});
  const strength=Math.round(Math.max(5,Math.min(95,(help/all)*100*1.35)));
  const band=strength<40?'신약':strength>60?'신강':'중화';
  const share=els.map(v=>v/total);
  const season=[11,0,1].includes(P.month.b)?'winter':[5,6,7].includes(P.month.b)?'summer':'mid';
  const achieve={표현형:gods.식신+gods.상관,전문형:gods.편인+gods.정인,관리형:gods.정관,실행형:gods.편관+gods.겁재,기회형:gods.편재,안정형:gods.정재+gods.비견};
  const achieveType=Object.entries(achieve).sort((a,b)=>b[1]-a[1]);
  const weakEl=share.indexOf(Math.min(...share)), strongEl=share.indexOf(Math.max(...share));
  return {dayStem:day,dayEl:stemEl(day),elements:share.map(v=>+(v*100).toFixed(1)),strength,band,season,gods,achieveType:achieveType.map(x=>x[0]),weakEl,strongEl}
}

const BASE={비견:{achieve:3,relation:4,money:-2},겁재:{change:3,relation:3,money:-5},식신:{achieve:8,money:4,condition:1},상관:{achieve:6,change:6,relation:2},
 편재:{money:7,change:4,relation:3},정재:{money:8,condition:1},편관:{achieve:6,change:5,condition:-4},정관:{achieve:7,condition:1},편인:{achieve:3,change:4,condition:2},정인:{achieve:4,condition:6}};
const DOM=['money','achieve','relation','change','condition'];
const SAL={0:[2,9,4],4:[2,9,4],8:[2,9,4],2:[8,3,10],6:[8,3,10],10:[8,3,10],5:[11,6,1],9:[11,6,1],1:[11,6,1],11:[5,0,7],3:[5,0,7],7:[5,0,7]};
function rawScore(chart,p){
  const n=chart.natal,day=n.dayStem,out={money:0,achieve:0,relation:0,change:0,condition:0},tags=[];
  const units=[[p.s,1]].concat(HIDDEN[p.b].map(([s,d])=>[s,d/30]));
  const contrib={};
  units.forEach(([s,w])=>{const g=tenGod(day,s),isHelp=['비견','겁재','편인','정인'].includes(g);
    let mult=1; if(n.band==='신약')mult=isHelp?1.3:0.75; if(n.band==='신강')mult=isHelp?0.7:1.3;
    const sh=n.elements[stemEl(s)]; const sat=sh>35?0.6:sh<8?1.2:1;
    for(const k in BASE[g]){const v=BASE[g][k]*w*(BASE[g][k]>0?mult*sat:1);out[k]+=v;contrib[g+'|'+k]=(contrib[g+'|'+k]||0)+Math.abs(v)}
    if(n.band==='신약'&&!isHelp)out.condition-=1.5*w;
    if(n.season==='winter'&&stemEl(s)===1)out.condition+=2*w;
    if(n.season==='summer'&&stemEl(s)===4)out.condition+=2*w;
  });
  const P=chart.pillars;const pos=[['연지',P.year.b],['월지',P.month.b],['일지',P.day.b],['시지',P.hour?P.hour.b:null]];
  pos.forEach(([nm,b])=>{if(b==null)return;
    if(CLASH(b)===p.b){const big=nm==='일지'?10:nm==='월지'?8:5;out.change+=big;out.condition-=nm==='일지'?3:2;if(nm==='일지')out.relation+=2;tags.push(nm+' 충')}
    if(HAP6[b]===p.b){out.relation+=nm==='일지'?6:4;tags.push(nm+' 합')}});
  const sal=SAL[P.day.b]; if(p.b===sal[0]){out.change+=5;tags.push('역마')} if(p.b===sal[1]){out.relation+=5;tags.push('도화')} if(p.b===sal[2]){out.achieve+=4;tags.push('화개')}
  const g0=tenGod(day,p.s),g1=tenGod(day,HIDDEN[p.b][HIDDEN[p.b].length-1][0]);
  return {out,tags,gods:[g0,g1]}
}
let CAL={"money":[2.609,3.732],"achieve":[8.006,3.079],"relation":[4.395,2.401],"change":[7.274,3.89],"condition":[0.594,2.545]};
const normK=(k,v)=>Math.round(Math.max(10,Math.min(95,50+(v-CAL[k][0])/CAL[k][1]*15)));
const norm=v=>Math.round(Math.max(10,Math.min(95,50+v*2.2)));
function mix(parts){const o={money:0,achieve:0,relation:0,change:0,condition:0};parts.forEach(([r,w])=>DOM.forEach(k=>o[k]+=r.out[k]*w));if(mix.raw)mix.raw.push(o);const sc={};DOM.forEach(k=>sc[k]=normK(k,o[k]));return sc}
function dwAt(chart,date){const age=(date-chart.utc)/(365.2425*864e5);let cur=null;for(const d of chart.daewoon)if(age>=d.ageStart)cur=d;return cur}
function yearScores(chart,y0,y1){const res=[];let prev=null;
  for(let y=y0;y<=y1;y++){const mid=new Date(Date.UTC(y,6,1));const dw=dwAt(chart,mid);const sp=yearPillar(y);
    const rs=rawScore(chart,sp);const rd=dw?rawScore(chart,dw):{out:{money:0,achieve:0,relation:0,change:0,condition:0},tags:[],gods:[]};
    const sc=mix([[rd,0.5],[rs,0.5]]);
    const dwChange=chart.daewoon.some(d=>Math.floor(d.yearStart)===y);
    let tp=0,why=[];if(dwChange){tp+=30;why.push('대운 교체')}
    if(CLASH(chart.pillars.day.b)===sp.b){tp+=25;why.push('일지 충')}
    if(CLASH(chart.pillars.month.b)===sp.b){tp+=15;why.push('월지 충')}
    if(prev){const dl=DOM.reduce((a,k)=>a+Math.abs(sc[k]-prev[k]),0);tp+=Math.min(20,dl/3)}
    prev=sc;
    const dwNew=chart.daewoon.find(d=>Math.floor(d.yearStart)===y);const dwPrevIdx=dwNew?chart.daewoon.indexOf(dwNew)-1:-1;
    const dwLabel=dwNew?((dwPrevIdx>=0?pairName(chart.daewoon[dwPrevIdx]):'대운 전')+'→'+pairName(dwNew)):(dw?pairName(dw):null);
    res.push({year:y,age:y-chart.inp.y,pillar:pairName(sp),daewoon:dwLabel,scores:sc,top:DOM.slice().sort((a,b)=>sc[b]-sc[a])[0],
      tags:[...new Set([...rd.tags,...rs.tags])].filter(t=>!why.includes(t)).slice(0,3),gods:{daewoon:rd.gods,seun:rs.gods},turning:Math.round(tp),why})}
  return res}
function decadeScores(chart){return chart.daewoon.slice(0,8).map(d=>{const r=rawScore(chart,d);const sc={};DOM.forEach(k=>sc[k]=normK(k,r.out[k]));
  return {pillar:pairName(d),ageStart:+d.ageStart.toFixed(1),ageYear:Math.floor(d.yearStart)-chart.inp.y,yearStart:Math.floor(d.yearStart),scores:sc,tags:r.tags,gods:r.gods}})}
function next12Months(chart,from){const out=[];let t=jeolPrev(from);
  for(let i=0;i<12;i++){const mid=new Date(t.getTime()+15*864e5);const mp=monthPillar(mid);const sy=sajuYear(mid);const yp=yearPillar(sy);const dw=dwAt(chart,mid);
    const rm=rawScore(chart,mp),ry=rawScore(chart,yp),rd=dw?rawScore(chart,dw):{out:{money:0,achieve:0,relation:0,change:0,condition:0},tags:[],gods:[]};
    const sc=mix([[rd,0.3],[ry,0.4],[rm,0.3]]);const nxt=jeolNext(new Date(t.getTime()+864e5));
    const ranked=DOM.slice().sort((a,b)=>Math.abs(sc[b]-50)-Math.abs(sc[a]-50));
    out.push({start:t,end:nxt,label:(mid.getUTCMonth()+1)+'월',year:mid.getUTCFullYear(),pillar:pairName(mp),scores:sc,top:ranked[0],second:ranked[1],tags:[...new Set(rm.tags.concat(ry.tags))].slice(0,2),gods:rm.gods});
    t=nxt}
  return out}

  S.mbti={type,pct,source:'test'}}

function makeData(){
  const i=S.input,[y,m,d]=i.date.split('-').map(Number);
  const [hh,mm]=i.noTime?[null,null]:i.time.split(':').map(Number);
  const auto=koreaClockOffset(y,m,d,hh,mm);const tz=i.tz!=null?i.tz:auto.tz;const dst=i.tz!=null?!!i.dst:auto.dst;
  const chart=buildChart({y,m,d,hh,mm,lon:i.lon,tz,dst,gender:i.gender,ziMode:i.ya?'ya':'jo'});
  const now=new Date(),cy=now.getFullYear(),age=cy-y;
  const years=yearScores(chart,Math.max(y+8,1930),cy+15);
  const decades=decadeScores(chart);
  // turning points: top by index, min gap 4y, age 12~75
  const cand=years.filter(t=>t.age>=12&&t.age<=80).sort((a,b)=>b.turning-a.turning);const tps=[];
  const pick=(list,max)=>{let dwc=tps.filter(t=>t.why.includes('대운 교체')).length,n=0;for(const c of list){if(n>=max||tps.length>=5)break;const isDw=c.why.includes('대운 교체');if(isDw&&dwc>=3)continue;if(tps.every(t=>Math.abs(t.year-c.year)>=4)){tps.push(c);n++;if(isDw)dwc++}}};
  const fut=cand.filter(t=>t.year>=cy),past=cand.filter(t=>t.year<cy);
  pick(fut,past.length?3:5);pick(past,5-tps.length);if(tps.length<5)pick(fut,5-tps.length);
  tps.sort((a,b)=>a.year-b.year);
  const months=next12Months(chart,now);
  const mAvg={};DOM.forEach(k=>mAvg[k]=months.reduce((a,m)=>a+m.scores[k],0)/months.length);
  // 대표 영역 = 내 12개월 평균보다 '가장 많이 높은' 영역.
  // 절대 점수로 고르면 원국이 강한 한 영역이 12칸을 독식하고,
  // 편차 절댓값으로 고르면 가장 낮은 영역이 대표가 된다. 양의 편차 최대가 둘 다 피한다.
  months.forEach(m=>{const rank=DOM.slice().sort((a,b)=>(m.scores[b]-mAvg[b])-(m.scores[a]-mAvg[a]));
    m.top=rank[0];m.second=rank[1];m.topDev=Math.round(m.scores[m.top]-mAvg[m.top]);m.avg=mAvg});
  const recent=years.filter(t=>t.year>=cy-5&&t.year<=cy+10);
  const bigMoney=years.filter(t=>t.year>=cy&&t.year<=cy+12).sort((a,b)=>b.scores.money-a.scores.money).slice(0,3).sort((a,b)=>a.year-b.year);
  const cautions=years.filter(t=>t.year>=cy&&t.year<=cy+10).map(t=>({t,risk:(100-t.scores.condition)+(t.scores.change>70?t.scores.change-70:0)})).sort((a,b)=>b.risk-a.risk).slice(0,2).map(x=>x.t).sort((a,b)=>a.year-b.year);
  const P=chart.pillars;
  return {chart,age,cy,years,recent,decades,tps,months,bigMoney,cautions,
    pillars:{year:pairName(P.year),month:pairName(P.month),day:pairName(P.day),hour:P.hour?pairName(P.hour):null},
    ilgan:ILGAN[P.day.s],key:KEYS[P.day.s]+'_'+i.gender}
}

 '일지 충':'가까운 관계·생활이 흔들리는 자리','월지 충':'일과 일정이 흔들리는 자리','연지 충':'바깥 환경이 흔들리는 자리','시지 충':'계획이 밀리는 자리',

function gl(t){const k=String(t).trim();if(GLOSS[k])return k+'('+GLOSS[k]+')';
 const g=Object.keys(GLOSS).find(x=>k.startsWith(x)&&x.length>1);return g?k+'('+GLOSS[g]+')':k}

function basisHTML(list,extra){const a=(list||[]).filter(Boolean);const items=a.map(t=>{const k=String(t).trim();const g=GLOSS[k]||GLOSS[Object.keys(GLOSS).find(x=>k.startsWith(x)&&x.length>1)||'']||'';return `<b class="gt"${g?` title="${esc(g)}"`:''}>${esc(hj(k))}</b>`});
 if(extra)items.unshift(`<b>${esc(extra)}</b>`);

const RULES=`[원칙 — 반드시 지킬 것]
- 사주 계산값, 점수, 연도, 태그는 코드가 확정한 값이다. 새로 계산하거나 바꾸지 말고 근거로만 써라.
- 카드1의 "일치하는 점"과 "다른 점"에서는 MBTI 네 글자를 주어로 써도 된다(예: "사주는 ~한데, ESFP는 ~해요"). 그 밖의 항목에서는 행동을 주어로 쓴다.
- 사주 해석과 MBTI 해석의 근거를 섞지 마라. "ENTJ라서 목성…" 같은 혼합 금지. 사주 근거 → MBTI 성향 → 둘의 관계 순으로 분리해 쓴다.
- MBTI가 null이면 MBTI 언급 없이 사주만으로 "나의 방식"을 쓰고 relation은 "사주 기준"으로 둔다.
- 좋은 이야기만 하지 마라. 약점과 불리한 흐름도 솔직하게 쓴다. 근거가 약하면 억지 의미 부여 금지.
- 다만 약점을 결함으로 단정하지 말고 관리 포인트로 번역해 쓴다. "힘이 약하게 태어났어요" → "에너지를 오래 유지하려면 나누어 쓰는 게 중요해요", "쉽게 지쳐요" → "움직인 뒤 회복할 여유가 중요해요", "무리한 확장을 경계해요" → "기반을 다진 뒤 넓혀가는 방식이 잘 맞아요", "돈이 새요" → "돈의 흐름이 커질 때 지출 관리가 중요해요", "화가 부족해요" → "밝게 드러내고 활발히 움직이는 활동을 의식적으로 더해볼 수 있어요". 금지 표현: 약하게 태어났다, 부족하다, 결핍, 문제다, 운이 나쁘다.
- 사용자가 실제로 겪은 일이나 감정을 아는 것처럼 쓰지 마라. "놀고 나면 크게 지쳐요", "관계가 헛헛했어요"처럼 생활 사실을 단정하지 말고 "움직인 만큼 회복이 필요한 구조예요"처럼 구조로만 쓴다.
- 오행 비율이 낮은 기운은 없는 것이 아니라 보완하면 좋은 기운으로 쓴다. \"충돌\"은 나쁜 뜻이 아니라 내 안에서 서로 다른 방향이 만나는 지점이라는 뜻으로 쓴다.

async function callCard(g){
  const base=apiBase();
  if(!base){ // Worker 주소가 없으면 예전 방식(Artifact 런타임)으로 — 개발용
    if(!sample) throw {code:'upstream'};
    const {text}=await sample(g==='P'?promptP():g==='A'?promptA():g==='B'?promptB():promptM(),{modelTier:g==='M'?'quick':'default',onText:({text})=>{S.ai[g].len=text.length;const el=$('ld_'+g);if(el)el.textContent=text.length.toLocaleString()+'자 작성 중'}});
    return JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1));
  }
  let r; try{ r=await fetch(base+'/api/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card:g,data:payload(g)})}) }catch(_){ throw {code:'network'} }
  let j; try{ j=await r.json() }catch(_){ throw {code:'upstream'} }
  if(!j.ok) throw {code:j.code||'upstream'};
  return j.result;
}
async function runAI(g){
  S.ai[g]={loading:true,len:0};render();
  // network/upstream 은 일시적인 경우가 많아 한 번 더 시도한다
  const RETRY=new Set(['network','upstream']);
  for(let i=0;i<2;i++){
    try{ S.ai[g]=await callCard(g); saveResults(); break; }
    catch(e){
      const code=e&&e.code;
      if(i===0&&RETRY.has(code)){ await new Promise(r=>setTimeout(r,1200+Math.random()*800)); continue }
      S.ai[g]={error: ERRMSG[code] || (e instanceof SyntaxError?ERRMSG.validation:'해석을 불러오지 못했어요.'), tried:true};
    }
  }
  if(S.step==='result')render()}

 let pick=h,why='오늘 일진과 맞물리는 시간대예요.';
 if(!ACTIVE_BR.includes(h)){
   // 육합 시간이 새벽이면, 나를 밀어주는 오행(인성·비겁)의 시간 중 활동 시간대에서 고른다
   const e=stemEl(n.dayStem), want=[(e+4)%5, e];
   const cand=ACTIVE_BR.filter(x=>want.includes(BR_EL[x]));
   pick=(cand.length?cand:ACTIVE_BR).sort((x,y)=>brDist(x,h)-brDist(y,h))[0];
   why='오늘 내 기운을 밀어주는 시간대예요.';
 }
 return {label:BR_HOUR[pick],why,use:TIMEUSE[mbtiKey()]||TIMEUSE.N}}

const hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};

async function saveProfile(){const v={input:S.input,mbti:S.mbti,savedAt:Date.now()};S.saved=v;

async function loadProfile(){const r=profRef();

async function saveResults(){const done={};['P','A','B','M'].forEach(k=>{if(S.ai[k]&&!S.ai[k].loading&&!S.ai[k].error)done[k]=S.ai[k]});

async function loadResults(){const r=profRef();let out=null;

function edgeNote(){const c=S.data.chart;if(!c.hasTime)return '';const t=c.trueSolar.h*60+c.trueSolar.m;

 const unk=S.input.sido==='u';
 if(dist<=10)return `<p class="warnline">보정한 출생시간(${String(c.trueSolar.h).padStart(2,'0')}:${String(c.trueSolar.m).padStart(2,'0')})이 시진 경계에 가까워요. ${unk?'출생지':'출생지·시간'}에 따라 시주${Math.abs(t-1380)<=10||Math.abs(t+60-1440)<=10?'와 일주':''}가 달라질 수 있어요.</p>`;
 return unk?`<p class="fine">출생지를 몰라 한국 중부(동경 127.5°) 기준으로 계산했어요.</p>`:''}

function lineChart(){const D=S.data.decades,W=340,H=176,ks=['money','achieve','change'];
 const L=26;   // 왼쪽 눈금 자리
 const px=i=>L+8+i*(W-L-20)/Math.max(1,D.length-1),py=v=>H-26-(v-10)/85*(H-50);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="10년 단위 흐름">`;
 [30,50,70,90].forEach(v=>{const mid=v===50;
  s+=`<line x1="${L}" x2="${W-8}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"${mid?'':' stroke-dasharray="2 3"'}/>`;
  s+=`<text x="${L-4}" y="${py(v)+3}" font-size="9" text-anchor="end" fill="var(--sub)">${v}</text>`});
 const nowAge=S.data.age;D.forEach((d,i)=>{if(nowAge>=d.ageYear&&(i===D.length-1||nowAge<D[i+1].ageYear)){const x0=px(i),x1=i<D.length-1?px(i+1):Math.min(px(i)+ (px(1)-px(0)), W-8);s+=`<rect x="${x0}" y="6" width="${Math.max(18,x1-x0)}" height="${H-30}" fill="var(--chip)" rx="4"/>`}});
 ks.forEach(k=>{s+=`<polyline fill="none" stroke="${DOMC[k]}" stroke-width="2.4" points="${D.map((d,i)=>px(i)+','+py(d.scores[k])).join(' ')}"/>`;D.forEach((d,i)=>s+=`<circle cx="${px(i)}" cy="${py(d.scores[k])}" r="3" fill="${DOMC[k]}"/>`)});
 D.forEach((d,i)=>s+=`<text x="${px(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--sub)">${d.ageYear}세</text>`);
 return s+`</svg><div class="legend">${ks.map(k=>`<span><i style="background:${DOMC[k]}"></i>${DOMK[k]}</span>`).join('')}<span><i style="background:var(--chip);height:8px"></i>지금</span></div>

function watchMonths(){const M=S.data.months;
 const rows=M.map((m,k)=>({k,m,v:m.scores[m.top]}));
 const byHigh=rows.slice().sort((a,b)=>b.v-a.v);
 const byLow =rows.slice().sort((a,b)=>a.v-b.v);
 const pick=[],used=new Set(),domCount={};
 const add=(r,why,cap=2)=>{if(!r||pick.length>=4||used.has(r.k))return;
   const d=r.m.top; if((domCount[d]||0)>=cap)return;   // 같은 영역은 최대 2개까지
   used.add(r.k);domCount[d]=(domCount[d]||0)+1;pick.push({...r,why})};
 add(byHigh[0],'high');                                  // 가장 높은 달
 const turn=rows.slice(1).map(r=>({...r,gap:Math.abs(r.v-rows[r.k-1].v)})).sort((a,b)=>b.gap-a.gap)[0];
 add(turn,'turn');                                       // 앞달과 차이가 가장 큰 달
 if(byLow[0]&&byLow[0].v<50)add(byLow[0],'low');          // 실제로 낮을 때만 '조절할 달'
 for(const r of byHigh){if(pick.length>=4)break;if(!domCount[r.m.top])add(r,'high')}  // 아직 안 나온 영역 먼저
 for(const r of byHigh){if(pick.length>=4)break;add(r,'high')}
 for(const r of byLow){if(pick.length>=4)break;add(r,'low')}
 // 한 영역만 높은 사주는 위 규칙으로 4개를 못 채우므로 제한을 푼다
 for(const r of byHigh){if(pick.length>=4)break;add(r,'high',99)}
 return `<div class="relflow"><h4>👀 눈여겨볼 달</h4>

  <ul class="watch">${pick.sort((a,b)=>a.k-b.k).map(r=>`<li><b class="key">${r.m.label}</b><p>${mUse(r.m.top,r.v)}</p><small>${DOMK[r.m.top]} ${r.v} · ${LEVEL(r.v)}${r.why==='turn'?' · 흐름이 바뀌는 달':''}</small></li>`).join('')}</ul></div>`}

async function capture(el,filename){const msg=$('saveMsg');const say=t=>{if(msg)msg.textContent=t};
 if(!el){say('저장할 카드를 찾지 못했어요.');return}
 if(!window.html2canvas){say('이미지 도구를 불러오지 못했어요.');return}
 say('이미지 만드는 중…');
 try{try{await document.fonts.ready}catch(_){}
  const bg=getComputedStyle(document.body).getPropertyValue('--paper').trim()||'#F4ECDF';
  let cv=null,err=null;
  for(const sc of [3,2,1]){try{cv=await html2canvas(el,{backgroundColor:bg,scale:sc,useCORS:true,logging:false});break}catch(e){err=e}}
  if(!cv)throw err||new Error('render');
  const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
  await saveBlob(blob,filename,say)}
 catch(e){console.error('capture',e);say(e?.code==='declined'?'':'저장하지 못했어요'+(e?.code?' ('+e.code+')':e?.message?' ('+e.message+')':''))}}

// 저장 경로: 아티팩트(dl) → 공유 시트(아이폰) → 일반 다운로드
async function saveBlob(blob,filename,say){
  if(dl){await dl.save({filename,data:blob});say('');return}
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare?.({files:[file]})){
    try{ await navigator.share({files:[file]}); say(''); return }
    catch(e){ if(e?.name==='AbortError'){say('');return} }   // 사용자가 닫은 경우
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  say('저장했어요. 사진 앱이나 다운로드 폴더를 확인해보세요.');
  setTimeout(()=>say(''),4000);
}
const stamp=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
function saveShare(){const st=$('shareStage');st.innerHTML=shareHTML();capture(st.firstElementChild,`myluck-share-${stamp()}.png`)}
function saveCard(){const n=S.step==='today'?'today':'card'+(S.tab+1);capture($('card'),`myluck-${n}-${stamp()}.png`)}
